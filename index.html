<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2A52BE">
<title>접속자 모니터링 현황판</title>
<style>
* { box-sizing: border-box; }
body {
    background-color: #FFFFFF;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Pretendard', -apple-system, sans-serif;
}
main { width: 100%; text-align: center; overflow-wrap: anywhere; }
.title { color: #000000; font-size: 28px; font-weight: 900; margin: 0 0 20px; }
.count-number { color: #1A73E8; font-size: 100px; font-weight: 900; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.monitor-details { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 20px; right: 20px; font-size: 11px; color: #8B95A1; text-align: center; line-height: 1.6; }
.status { font-size: 12px; color: #8B95A1; }
.status.offline { color: #A34214; }.status.error { color: #B42331; }
time { display: block; font-size: 11px; color: #8B95A1; }
.description { margin: 6px 0; }.monitor-details a { color: #8B95A1; text-decoration: underline; }
a:focus-visible { outline: 3px solid #ffae42; outline-offset: 3px; }
@media(max-height:480px) { .monitor-details { position: static; margin-top: 24px; } body { justify-content: flex-start; padding-top: 30px; } }
</style></head>
<body><main><h1 class="title">현재 사이트 접속 수:</h1><div id="visitorCount" class="count-number" aria-label="현재 연결 수">—</div></main>
<footer class="monitor-details"><div id="status" class="status" role="status">서버에 연결하고 있습니다.</div><time id="updated"></time><p class="description">수강신청 도우미를 열어 둔 탭의 연결 수입니다. 같은 사람의 여러 탭은 각각 집계합니다.</p><a href="../course/">다시 돌아가기</a></footer>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script>/* Shared Firebase adapter, embedded into every standalone page by build.cjs. */
window.App = (() => {
  'use strict';
  const config = {apiKey:'AIzaSyD-IyAGGXQ69d8LupTU2mKmr87yoenahRo',authDomain:'gimpo-monitoring.firebaseapp.com',databaseURL:'https://gimpo-monitoring-default-rtdb.firebaseio.com',projectId:'gimpo-monitoring',storageBucket:'gimpo-monitoring.firebasestorage.app',messagingSenderId:'918422830852',appId:'1:918422830852:web:c9d6412cb2fc3dcc619a51'};
  let timer;
  function toast(text){let box=document.getElementById('appToast');if(!box){box=document.createElement('div');box.id='appToast';box.setAttribute('role','status');box.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);max-width:90vw;width:max-content;background:#191f28;color:white;padding:12px 18px;border-radius:12px;z-index:999999;white-space:pre-wrap;overflow-wrap:anywhere';document.body.append(box);}box.textContent=text;box.hidden=false;clearTimeout(timer);timer=setTimeout(()=>box.hidden=true,6500);}
  function error(e){const c=String(e?.code||''); if(c.includes('permission-denied')||c.includes('PERMISSION_DENIED'))return '접근 권한이 없습니다. 로그인 상태와 Firebase 보안 규칙을 확인해주세요.';if(c.includes('unauthenticated'))return '로그인이 필요합니다.';if(c.includes('resource-exhausted'))return '요청 한도에 도달했습니다. 잠시 후 다시 이용해주세요.';if(c.includes('popup-closed'))return '로그인 창이 닫혔습니다.';if(c.includes('credential')||c.includes('wrong-password')||c.includes('user-not-found'))return '이메일 또는 비밀번호를 확인해주세요.';if(c.includes('email-already'))return '이미 가입된 이메일입니다.';if(c.includes('network')||c.includes('unavailable'))return '서버에 연결할 수 없습니다. 연결 상태를 확인해주세요.';return e?.message||'요청을 처리하지 못했습니다. 다시 시도해주세요.';}
  const cache={read(key,fallback=null){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}},write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true;}catch{toast('기기 저장 공간에 접근할 수 없습니다. 창을 닫기 전에 저장 상태를 확인해주세요.');return false;}},remove(key){try{localStorage.removeItem(key);}catch{}}};
  const demo=new URLSearchParams(location.search).get('demo')==='1';
  const api={config,toast,error,cache,demo,offline:demo||!window.firebase||!firebase.auth||!firebase.database||!firebase.storage||!firebase.functions,isMember:u=>Boolean(u&&!u.isAnonymous),releaseImages(container){container?.querySelectorAll('img').forEach(img=>{if(img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);});}};
  if(api.offline){if(!demo)api.initializationError={code:'sdk/unavailable',message:'Firebase 연결 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해주세요.'};api.auth={currentUser:null,onAuthStateChanged(fn){queueMicrotask(()=>fn(null));return ()=>{};}};api.ready=Promise.resolve(null);return api;}
  firebase.initializeApp(config);api.auth=firebase.auth();api.db=firebase.database();api.storage=firebase.storage();api.functions=firebase.app().functions('asia-northeast3');
  let signing=null,resolveReady;api.ready=new Promise(resolve=>resolveReady=resolve);
  api.retryAuthentication=()=>{
    if(api.auth.currentUser)return Promise.resolve(api.auth.currentUser);
    if(signing)return signing;
    signing=api.auth.signInAnonymously().then(cred=>{api.authError=null;resolveReady(cred.user);return cred.user;}).catch(e=>{if(api.auth.currentUser){api.authError=null;resolveReady(api.auth.currentUser);return api.auth.currentUser;}api.authError={code:e.code||'auth/unknown',message:e.message||error(e)};window.dispatchEvent(new CustomEvent('app-auth-error',{detail:api.authError}));toast('기기 내 연습은 가능합니다. 서버 연결: '+error(e));resolveReady(null);throw e;}).finally(()=>{signing=null;});
    return signing;
  };
  api.auth.onAuthStateChanged(user=>{if(user){api.authError=null;resolveReady(user);return;}api.retryAuthentication().catch(()=>{});});
  api.signInGoogle=async()=>{const provider=new firebase.auth.GoogleAuthProvider();return api.auth.signInWithPopup(provider);};
  api.signInEmail=(email,password)=>api.auth.signInWithEmailAndPassword(email.trim(),password);
  api.signOut=()=>api.auth.signOut();api.isAdmin=async()=>Boolean((await api.auth.currentUser?.getIdTokenResult(true))?.claims.admin);
  api.uploadImages=async(uid,files)=>{if(files.length>3)throw new Error('사진은 한 번에 3장까지 첨부할 수 있습니다.');for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024)throw new Error('사진은 JPG·PNG·WEBP, 한 장당 5MB 이하로 선택해주세요.');}const uploaded=[];try{for(const f of files){const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];const path=`inquiryUploads/${uid}/${crypto.randomUUID()}/image.${ext}`;await api.storage.ref(path).put(f,{contentType:f.type});uploaded.push({path,name:f.name.slice(0,100)});}return uploaded;}catch(e){await Promise.allSettled(uploaded.map(x=>api.storage.ref(x.path).delete()));throw e;}};
  api.imageElement=async image=>{const wrap=document.createElement('div');try{if(!image||typeof image.path!=='string'||!/^inquiryUploads\/[^/]+\/[^/]+\/(image|[0-2])\.(jpg|png|webp)$/.test(image.path))throw new Error('이전 이미지 또는 지원하지 않는 첨부입니다.');const token=await api.auth.currentUser.getIdToken();const response=await fetch(`https://firebasestorage.googleapis.com/v0/b/${config.storageBucket}/o/${encodeURIComponent(image.path)}?alt=media`,{headers:{Authorization:`Firebase ${token}`},signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('이미지를 읽을 수 없습니다.');const blob=await response.blob();if(!/^image\/(jpeg|png|webp)$/.test(blob.type))throw new Error('지원하지 않는 이미지입니다.');const url=URL.createObjectURL(blob),img=document.createElement('img'),link=document.createElement('a');img.src=url;img.alt=image.name||'문의 첨부';img.style.cssText='max-width:100%;width:220px;border-radius:12px;display:block';link.href=url;link.download=image.name||'image';link.textContent='이미지 저장';wrap.append(img,link);}catch(e){wrap.textContent=error(e);}return wrap;};
  return api;
})();
</script>
<script>
(() => {'use strict';const count=document.getElementById('visitorCount'),status=document.getElementById('status'),updated=document.getElementById('updated');let presence=null,connectedRef=null,epoch=0,connected=false,loaded=false,readFailed=false;
function show(text,kind=''){status.textContent=text;status.className='status'+(kind?' '+kind:'');}
function stop(){epoch++;if(presence)presence.off();if(connectedRef)connectedRef.off();presence=null;connectedRef=null;}
function start(user){stop();count.textContent='—';updated.textContent='';loaded=false;connected=false;readFailed=false;if(!user){show('로그인 연결을 기다리고 있습니다.','offline');return;}const version=epoch;connectedRef=App.db.ref('.info/connected');connectedRef.on('value',snap=>{if(version!==epoch)return;connected=snap.val()===true;if(!connected)show('연결이 끊겼습니다. 마지막 수치는 현재 접속 수가 아닐 수 있습니다.','offline');else if(readFailed)show('접속 현황을 읽을 권한이 없거나 서버 오류가 발생했습니다.','error');else show(loaded?'실시간으로 갱신 중입니다.':'접속 현황을 불러오는 중입니다.');});presence=App.db.ref('v2/presence');presence.on('value',snap=>{if(version!==epoch)return;let total=0;snap.forEach(userSnap=>{userSnap.forEach(connectionSnap=>{if(connectionSnap.val()===true)total++;});});loaded=true;readFailed=false;count.textContent=String(total);const date=new Date();updated.dateTime=date.toISOString();updated.textContent='마지막 갱신 '+new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(date);if(connected)show('실시간으로 갱신 중입니다.');},error=>{if(version!==epoch)return;readFailed=true;count.textContent='—';show(App.error(error),'error');});}
if(!window.App||App.offline){show('접속 현황은 서버 연결이 필요합니다. 인터넷 연결과 Firebase 설정을 확인해 주세요.','error');return;}App.ready.then(()=>App.auth.onAuthStateChanged(start)).catch(error=>show(App.error(error),'error'));window.addEventListener('pagehide',stop);window.addEventListener('pageshow',event=>{if(event.persisted)start(App.auth.currentUser);});
})();
</script></body></html>
